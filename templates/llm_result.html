<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Medical Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 30px;
            background-color: #f8f9fa;
        }
        .summary-box {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">AI Analysis of Your Symptoms</h1>

    <div class="summary-box">
        <p><strong>Your description:</strong> {{ description }}</p>
        <p><strong>Extracted symptoms:</strong> {{ extracted_symptoms|join(', ') }}</p>
        <hr>
        <h5 class="mt-3">AI Summary:</h5>
        <pre>{{ summary }}</pre>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
