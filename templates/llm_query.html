<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Describe Your Symptoms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 30px;
        }
        h1 {
            color: #343a40;
        }
        .form-container {
            max-width: 700px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container form-container">
        <h1 class="mb-4 text-center">Describe Your Symptoms</h1>
        <form method="POST" action="/llm_query">
            <div class="mb-3">
                <label for="description" class="form-label">Enter your symptoms (in a full sentence):</label>
                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Example: I have chest pain and feel dizzy."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Choose an operator (optional):</label>
                <select class="form-select" name="operator">
                    <option value="">No operator</option>
                    <option value="AND">AND</option>
                    <option value="OR">OR</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Submit</button>
                <a href="/" class="btn btn-secondary ms-2">Back to Manual Search</a>
            </div>
        </form>
    </div>
</body>
</html>
